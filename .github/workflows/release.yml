name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycurl pyinstaller

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content git_over_pycurl.py -Raw
          if ($content -match 'VERSION\s*=\s*"([^"]+)"') { $ver = $Matches[1] } else { $ver = "0.0.0" }
          $build = "${{ github.run_number }}"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver-build.$build" >> $env:GITHUB_OUTPUT
          "pretty=$ver (build $build)" >> $env:GITHUB_OUTPUT

      - name: Build portable exe
        run: pyinstaller --clean --noconfirm --distpath dist --workpath build packaging/git-over-pycurl.spec

      - name: Build self-test of bundled exe
        shell: pwsh
        run: |
          .\dist\git-over-pycurl.exe selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rename portable artifact
        shell: pwsh
        run: Rename-Item dist\git-over-pycurl.exe git-over-pycurl-portable.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' | Select-Object -First 1).FullName }
          & $iscc "/DAppVersion=${{ steps.version.outputs.pretty }}" "/DSourceExe=$PWD\dist\git-over-pycurl-portable.exe" packaging\inno\git-over-pycurl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: git-over-pycurl-${{ steps.version.outputs.tag }}
          path: |
            dist/git-over-pycurl-portable.exe
            packaging/inno/Output/git-over-pycurl-setup.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/git-over-pycurl-portable.exe
            packaging/inno/Output/git-over-pycurl-setup.exe
